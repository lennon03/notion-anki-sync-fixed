[tool.poetry]
name = "notion-anki-sync"
version = "1.3.0"
description = "Anki addon that creates decks from Notion pages (official API): page -> deck, table -> subdeck, row -> card."
repository = "https://github.com/9dogs/notion-anki-sync"
homepage = "https://github.com/9dogs/notion-anki-sync"
authors = ["Mikhail Knyazev <hellishbot@gmail.com>"]
license = "GPL-3.0-only"
readme = "README.md"
# an Anki add-on, not an installable package: Poetry only manages the tools
package-mode = false

[tool.poetry.dependencies]
# the Python bundled with Anki 26.x
python = ">=3.13,<3.14"

[tool.poetry.group.dev.dependencies]
# the add-on runs inside Anki; tests use Anki's collection library and Qt
anki = "26.9.3"
pyqt6 = "6.11.0"  # what Anki 26.9.3 ships (6.12's stubs break mypy)
black = "^26.10"
isort = "^9.0"
mypy = "^2.4"
flake8 = "^7.3"
pydocstyle = "^6.3"
pytest = "^9.0"
pytest-cov = "^7.1"

[tool.black]
line-length = 79
skip-string-normalization = true
target-version = ["py313"]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
default_section = "THIRDPARTY"
known_first_party = "notion_sync_addon,tests"

[tool.mypy]
python_version = "3.13"
sqlite_cache = true
ignore_missing_imports = true
check_untyped_defs = true
show_error_codes = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
