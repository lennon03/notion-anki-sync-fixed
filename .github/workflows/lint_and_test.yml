name: Lint & test

on: [push]

jobs:
  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade poetry
        poetry install
    - name: Lint code
      run: |
        make lint

  test:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install system dependencies
        # libraries the PyQt6 wheels expect (the settings dialog tests run
        # Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade poetry
          poetry install
      - name: Test code
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          make test

  worker:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r hosted/worker/requirements-dev.txt
          npm ci
      - name: Lint and test worker
        env:
          MYPYPATH: ${{ github.workspace }}
        run: npx turbo run lint test --filter=notion-anki-sync-worker

  site:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build and typecheck site
        run: npx turbo run build typecheck --filter=notion-anki-sync-web
