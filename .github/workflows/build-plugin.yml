name: Build Plugin

on:
  release:
    types: [published]

jobs:
  build-plugin:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set env
      run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
    - name: Build plugin
      uses: thedoctor0/zip-release@a24011d8d445e4da5935a7e73c1f98e22a439464 # master
      with:
        filename: notion-sync-${{ env.RELEASE_VERSION }}.ankiaddon
        directory: notion_sync_addon
        exclusions: '*pycache*'
    - name: Upload plugin
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
      with:
        allowUpdates: true
        artifacts: notion_sync_addon/notion-sync-${{ env.RELEASE_VERSION }}.ankiaddon
        token: ${{ secrets.GITHUB_TOKEN }}
