name: Build Plugin

# Every push to main or experimental builds a .ankiaddon and keeps it as a
# workflow artifact. Publishing a release also attaches it to the release.
on:
  push:
    branches: [main, experimental]
  release:
    types: [published]

jobs:
  build-plugin:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Set env
      run: |
        if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
          VERSION="${GITHUB_REF_NAME}"
        else
          VERSION="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
        fi
        echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"
    - name: Build plugin
      run: |
        cd notion_sync_addon
        zip -r "notion-sync-${RELEASE_VERSION}.ankiaddon" . -x '*__pycache__*' '*.pyc'
    - name: Keep the build
      uses: actions/upload-artifact@v4
      with:
        name: notion-sync-${{ env.RELEASE_VERSION }}
        path: notion_sync_addon/notion-sync-${{ env.RELEASE_VERSION }}.ankiaddon
        if-no-files-found: error
    - name: Upload plugin to the release
      if: github.event_name == 'release'
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
      with:
        allowUpdates: true
        artifacts: notion_sync_addon/notion-sync-${{ env.RELEASE_VERSION }}.ankiaddon
        token: ${{ secrets.GITHUB_TOKEN }}
